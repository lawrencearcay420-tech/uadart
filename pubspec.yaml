name: clothingapp
description: "Under Asawa - A premium fashion e-commerce application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.2
  go_router: ^15.1.2
  intl: ^0.20.0
  uuid: ^4.5.1
